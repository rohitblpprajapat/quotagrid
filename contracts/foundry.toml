# Monad Foundry configuration
# Reference: https://docs.monad.xyz/tooling-and-infra/toolkits/foundry.md
# Reference: https://docs.monad.xyz/guides/verify-smart-contract/foundry.md
# Reference: https://raw.githubusercontent.com/monad-developers/foundry-monad/main/foundry.toml
# Note on evm_version: Monad documentation does not specify an explicit evm_version field in foundry.toml.
# Per https://docs.monad.xyz/tooling-and-infra/toolkits/foundry.md, local Monad execution defaults to
# the latest supported Monad hardfork (currently MonadTen, Fusaka compatible), so evm_version is left to default.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
use_literal_content = true

# Monad Testnet Configuration
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143
network = "monad"

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
